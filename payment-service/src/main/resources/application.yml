server:
  port: 8095

spring:
  application:
    name: payment-service
  webflux:
    problemdetails:
      enabled: true
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/payment_db
    username: ${DB_USERNAME:saga}
    password: ${DB_PASSWORD:parallel}
  # JDBC datasource used only by Flyway and by DataSourceAutoConfiguration's primary
  # DataSource bean (re-imported in the application class); the app itself talks to
  # PostgreSQL reactively via spring.r2dbc above.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/payment_db
    username: ${DB_USERNAME:saga}
    password: ${DB_PASSWORD:parallel}

---
spring:
  config:
    activate:
      on-profile: '!local'

logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    com.bravo.saga: DEBUG
  file:
    name: /tmp/payment-service.log
  logback:
    rollingpolicy:
      clean-history-on-start: true
